<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Event Registration System</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/13b6098064.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="auth-wrap">
      <!-- LOGIN FORM -->
      <div class="login-form" id="loginBox">
        <div class="form-title">School Event Registration</div>
        <div class="form-subtitle">Welcome back! Login to your account.</div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Student ID or Email</label>
            <input
              type="text"
              id="loginId"
              class="form-input"
              placeholder="Enter ID or email"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              id="loginPassword"
              class="form-input"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="submit-btn" id="loginBtn">Login</button>
        </form>

        <div id="loginMessage"></div>

        <div class="form-footer">
          Don't have an account? <a id="showSignup">Sign up</a>
        </div>
      </div>

      <!-- SIGN UP FORM -->
      <div class="login-form hidden" id="signupBox">
        <div class="form-title">Create Account</div>
        <div class="form-subtitle">Sign up to register for school events</div>

        <form id="signupForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="suFirstName">First Name</label>
              <input type="text" id="suFirstName" class="form-input" placeholder="Juan" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="suLastName">Last Name</label>
              <input type="text" id="suLastName" class="form-input" placeholder="Dela Cruz" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="suMiddleName">Middle Name</label>
            <input type="text" id="suMiddleName" class="form-input" placeholder="Optional" />
          </div>

          <div class="form-group">
            <label class="form-label">Student ID</label>
            <input
              type="text"
              id="suStudentId"
              class="form-input"
              placeholder="2400000000"
              maxlength="10"
              required
            />
            <div class="hint">Format: 10 digits, e.g. 2400000000</div>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              id="suEmail"
              class="form-input"
              placeholder="you@school.com"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Program</label>
            <select id="suProgram" class="form-select" required>
              <option value="">Select Program</option>
              <option value="IT">IT — Information Technology</option>
              <option value="CS">CS — Computer Science</option>
              <option value="EN">EN — Electronics Engineering</option>
              <option value="CpE">CpE — Computer Engineering</option>
            </select>
          </div>

          <div id="suSectionGroup" class="form-group hidden">
            <label class="form-label">Section</label>
            <input
              type="text"
              id="suSection"
              class="form-input"
              placeholder="e.g. EN1A"
              maxlength="10"
            />
            <div class="hint">Enter your section.</div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Password</label>
              <input
                type="password"
                id="suPassword"
                class="form-input"
                placeholder="••••••••"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <input
                type="password"
                id="suConfirm"
                class="form-input"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <button type="submit" class="submit-btn" id="signupBtn">
            Register
          </button>
        </form>

        <div id="signupMessage"></div>

        <div class="form-footer">
          Already have an account? <a id="showLogin">Sign in</a>
        </div>
      </div>
    </div>

    <script type="module" src="js/pages/auth.js"></script>
  </body>
</html>
