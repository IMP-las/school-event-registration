<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizer Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="navbar">
    <h2>📊 Organizer Dashboard</h2>
    <div class="right">
      <span class="user-name" id="userName"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="main-content">

      <div class="section">
        <h2>Create New Event</h2>
        <form id="eventForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Event Name</label>
              <input type="text" id="eventName" class="form-input" placeholder="e.g. Science Fair 2024" required>
            </div>
            <div class="form-group">
              <label class="form-label">Date & Time</label>
              <input type="datetime-local" id="eventDate" class="form-input" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Location</label>
              <input type="text" id="eventLocation" class="form-input" placeholder="e.g. Main Gymnasium" required>
            </div>
            <div class="form-group">
              <label class="form-label">Capacity</label>
              <input type="number" id="eventCapacity" class="form-input" placeholder="e.g. 100" min="1" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" id="eventDesc" class="form-input" placeholder="Short description..." required>
          </div>
          <button type="submit" class="submit-btn">Create Event</button>
        </form>
        <div id="formMessage"></div>
      </div>

      <div class="section">
        <h2>My Events</h2>
        <div id="myEvents"><div class="loading">Loading...</div></div>
      </div>

    </div>
  </div>

  <div class="modal" id="participantModal">
    <div class="modal-box">
      <h2 id="modalTitle">Event Participants</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Student Name</th><th>Student ID</th><th>Program</th><th>Registered On</th></tr></thead>
          <tbody id="participantBody"></tbody>
        </table>
      </div>
      <button class="submit-btn" style="background:#6b7280; margin-top:16px;" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    let currentUser = null;

    function checkAuth() {
      const user = localStorage.getItem('user');
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = JSON.parse(user);
      if (currentUser.role !== 'organizer') { window.location.href = 'index.html'; return; }
      document.getElementById('userName').textContent = currentUser.fullName;
      loadMyEvents();
    }

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const eventName = document.getElementById('eventName').value;
      const description = document.getElementById('eventDesc').value;
      const eventDate = document.getElementById('eventDate').value;
      const location = document.getElementById('eventLocation').value;
      const capacity = parseInt(document.getElementById('eventCapacity').value);

      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            eventName, description, eventDate, location, capacity,
            organizerId: currentUser.userId, organizerName: currentUser.fullName
          })
        });
        const data = await res.json();

        if (data.success) {
          showMsg('✅ Event created successfully!', 'success');
          document.getElementById('eventForm').reset();
          loadMyEvents();
        } else {
          showMsg('❌ ' + data.message, 'error');
        }
      } catch (err) {
        showMsg('❌ Error creating event.', 'error');
      }
    });

    async function loadMyEvents() {
      try {
        const res = await fetch(`/api/organizer/events/${currentUser.userId}`);
        const events = await res.json();
        const container = document.getElementById('myEvents');

        if (events.length === 0) {
          container.innerHTML = '<div class="empty-state">You haven\'t created any events yet.</div>';
          return;
        }

        container.innerHTML = `<div class="cards-grid">${events.map(e => `
          <div class="card">
            <h3>${e.eventName}</h3>
            <p>${e.description}</p>
            <p>📅 ${formatDate(e.eventDate)}</p>
            <p>📍 ${e.location}</p>
            <p>👥 Registered: <strong>${e.registeredCount}</strong> / ${e.capacity}</p>
            <p>Status: <strong>${e.status}</strong></p>
            <div class="btn-group">
              <button class="btn-small btn-primary" onclick="viewParticipants('${e.eventId}', '${e.eventName}')">View Participants</button>
              <button class="btn-small btn-danger" onclick="deleteEvent('${e.eventId}', '${e.eventName}')">Delete</button>
            </div>
          </div>
        `).join('')}</div>`;
      } catch (err) {
        document.getElementById('myEvents').innerHTML = '<div class="empty-state">Error loading events.</div>';
      }
    }

    async function viewParticipants(eventId, eventName) {
      try {
        const res = await fetch(`/api/events/${eventId}/registrations`);
        const regs = await res.json();

        document.getElementById('modalTitle').textContent = `Participants — ${eventName}`;
        const tbody = document.getElementById('participantBody');
        tbody.innerHTML = '';

        if (regs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#aaa;">No registrations yet</td></tr>';
        } else {
          regs.forEach((r, i) => {
            tbody.innerHTML += `<tr>
              <td>${i + 1}</td>
              <td>${r.studentName}</td>
              <td>${r.studentIdNumber || '—'}</td>
              <td>${r.program || '—'}</td>
              <td>${r.registrationDate}</td>
            </tr>`;
          });
        }

        document.getElementById('participantModal').classList.add('active');
      } catch (err) {
        alert('❌ Error loading participants.');
      }
    }

    function closeModal() {
      document.getElementById('participantModal').classList.remove('active');
    }

    async function deleteEvent(eventId, eventName) {
      if (!confirm(`Delete event "${eventName}"? All registrations will also be removed.`)) return;
      try {
        const res = await fetch(`/api/events/${eventId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) { alert('✅ Event deleted.'); loadMyEvents(); }
        else alert('❌ ' + data.message);
      } catch (err) {
        alert('❌ Error deleting event.');
      }
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleString('en-PH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function showMsg(msg, type) {
      const div = document.getElementById('formMessage');
      div.className = `message ${type}`;
      div.textContent = msg;
      setTimeout(() => div.textContent = '', 3000);
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    checkAuth();
  </script>
</body>
</html>
