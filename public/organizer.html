<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organizer Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/13b6098064.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar"></div>

    <div class="container">
      <div class="main-content">
        <div class="section">
          <div class="section-header">
            <h2>My Events</h2>
            <button class="btn-small btn-primary" id="newEventBtn">
              <i class="fa-solid fa-plus"></i> New Event
            </button>
          </div>
          <div id="myEvents"><div class="loading">Loading...</div></div>
        </div>
      </div>
    </div>

    <!-- Create / edit event -->
    <div class="modal" id="eventModal">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="eventModalTitle">New Event</h2>
          <button type="button" class="icon-btn" data-close-modal aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="eventForm">
          <div class="form-group">
            <label class="form-label" for="eventName">Event Name</label>
            <input type="text" id="eventName" class="form-input" placeholder="e.g. Science Fair 2026" maxlength="100" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="eventDate">Date &amp; Time</label>
              <input type="datetime-local" id="eventDate" class="form-input" required />
              <div class="hint">Registration closes automatically when this time passes.</div>
            </div>
            <div class="form-group">
              <label class="form-label" for="eventCapacity">Capacity</label>
              <input type="number" id="eventCapacity" class="form-input" placeholder="e.g. 100" min="1" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="eventLocation">Location</label>
            <input type="text" id="eventLocation" class="form-input" placeholder="e.g. Main Gymnasium" maxlength="100" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="eventDesc">Description</label>
            <textarea id="eventDesc" class="form-input" rows="3" placeholder="Short description..." maxlength="1000" required></textarea>
          </div>
          <button type="submit" class="submit-btn" id="eventSubmitBtn">Create Event</button>
        </form>
        <div id="eventFormMessage"></div>
      </div>
    </div>

    <!-- Participants + attendance -->
    <div class="modal" id="participantModal">
      <div class="modal-box modal-wide">
        <div class="modal-header">
          <h2 id="participantTitle">Participants</h2>
          <button type="button" class="icon-btn" data-close-modal aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <p class="hint" id="attendanceSummary"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Student</th>
                <th>Student ID</th>
                <th>Program / Section</th>
                <th>Registered</th>
                <th>Present</th>
              </tr>
            </thead>
            <tbody id="participantBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module" src="js/pages/organizer.js"></script>
  </body>
</html>
