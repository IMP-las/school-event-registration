<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/13b6098064.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar"></div>

    <div class="container">
      <div class="main-content" id="tabs">
        <div class="tab-bar">
          <button class="tab-btn" data-tab="browse">Browse Events</button>
          <button class="tab-btn" data-tab="upcoming">My Upcoming <span class="tab-count" id="upcomingCount"></span></button>
          <button class="tab-btn" data-tab="history">History <span class="tab-count" id="historyCount"></span></button>
        </div>

        <div class="section" data-tab-panel="browse">
          <div class="toolbar">
            <input type="search" id="searchInput" class="form-input" placeholder="Search events by name, place or description" />
            <select id="statusFilter" class="form-select">
              <option value="all">All events</option>
              <option value="open">Open only</option>
              <option value="full">Full only</option>
            </select>
            <select id="rangeFilter" class="form-select">
              <option value="0">Any date</option>
              <option value="7">Next 7 days</option>
              <option value="30">Next 30 days</option>
            </select>
          </div>
          <div id="eventsList"><div class="loading">Loading...</div></div>
        </div>

        <div class="section hidden" data-tab-panel="upcoming">
          <div id="upcomingList"><div class="loading">Loading...</div></div>
        </div>

        <div class="section hidden" data-tab-panel="history">
          <div id="historyList"><div class="loading">Loading...</div></div>
        </div>
      </div>
    </div>

    <script type="module" src="js/pages/student.js"></script>
  </body>
</html>
