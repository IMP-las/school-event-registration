<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - System Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="navbar">
    <h2>Admin Dashboard</h2>
    <div class="user-info">
      <p>Welcome, <strong id="userName">Admin</strong></p>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="main-content">
      <div class="section">
        <h2>System Report</h2>
        <div class="stats-grid" id="statsGrid"></div>
      </div>

      <div class="section">
        <h2>➕ Add New User</h2>
        <form id="addUserForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="userNameInput">Full Name</label>
              <input type="text" id="userNameInput" required>
            </div>
            <div class="form-group">
              <label for="userEmail">Email</label>
              <input type="email" id="userEmail" required>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="userPassword">Password</label>
              <input type="password" id="userPassword" required>
            </div>
            <div class="form-group">
              <label for="userRole">Role</label>
              <select id="userRole" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="organizer">Organizer</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add User</button>
        </form>
      </div>

      <div class="section">
        <h2>👥 Manage Users</h2>
        <table id="usersTable">
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr>
        </table>
      </div>

      <div class="section">
        <h2>📋 Manage All Events</h2>
        <table id="eventsTable">
          <tr><th>ID</th><th>Title</th><th>Date</th><th>Organizer</th><th>Registrations</th><th>Action</th></tr>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function checkAuth() {
      const user = localStorage.getItem('user');
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = JSON.parse(user);
      if (currentUser.role !== 'admin') { window.location.href = 'index.html'; return; }
      document.getElementById('userName').textContent = currentUser.name;
      loadDashboard();
    }

    async function loadDashboard() {
      await loadSystemReport();
      await loadUsers();
      await loadAllEvents();
    }

    async function loadSystemReport() {
      const response = await fetch('/api/admin/report');
      const report = await response.json();

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-box"><div class="number">${report.totalUsers}</div><div class="label">Total Users</div></div>
        <div class="stat-box"><div class="number">${report.totalStudents}</div><div class="label">Students</div></div>
        <div class="stat-box"><div class="number">${report.totalOrganizers}</div><div class="label">Organizers</div></div>
        <div class="stat-box"><div class="number">${report.totalEvents}</div><div class="label">Events</div></div>
        <div class="stat-box"><div class="number">${report.totalRegistrations}</div><div class="label">Registrations</div></div>
        <div class="stat-box"><div class="number">${report.avgRegistrationsPerEvent}</div><div class="label">Avg/Event</div></div>
      `;
    }

    async function loadUsers() {
      const response = await fetch('/api/users');
      const users = await response.json();
      const tableBody = document.getElementById('usersTable');

      while (tableBody.rows.length > 1) tableBody.deleteRow(1);

      users.forEach(user => {
        const row = tableBody.insertRow();
        row.innerHTML = `
          <td>${user.userId}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.role.toUpperCase()}</td>
          <td><button class="btn btn-danger btn-small" onclick="deleteUser(${user.userId}, '${user.name}')">Delete</button></td>
        `;
      });
    }

    async function loadAllEvents() {
      const eventsResponse = await fetch('/api/events');
      const events = await eventsResponse.json();
      const tableBody = document.getElementById('eventsTable');

      while (tableBody.rows.length > 1) tableBody.deleteRow(1);

      for (const event of events) {
        const regResponse = await fetch(`/api/events/${event.eventId}/registrations`);
        const registrations = await regResponse.json();

        const row = tableBody.insertRow();
        row.innerHTML = `
          <td>${event.eventId}</td>
          <td>${event.title}</td>
          <td>${new Date(event.eventDate).toLocaleDateString()}</td>
          <td>${event.organizerName}</td>
          <td>${registrations.length}</td>
          <td><button class="btn btn-danger btn-small" onclick="deleteEvent(${event.eventId}, '${event.title}')">Delete</button></td>
        `;
      }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('userNameInput').value;
      const email = document.getElementById('userEmail').value;
      const password = document.getElementById('userPassword').value;
      const role = document.getElementById('userRole').value;

      const response = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role })
      });
      const data = await response.json();

      if (data.success) {
        alert('✅ User added!');
        document.getElementById('addUserForm').reset();
        loadUsers();
      } else {
        alert('❌ ' + data.message);
      }
    });

    async function deleteUser(userId, userName) {
      if (!confirm(`Delete user "${userName}"?`)) return;
      const response = await fetch(`/api/users/${userId}`, { method: 'DELETE' });
      const data = await response.json();
      if (data.success) { alert('✅ User deleted!'); loadDashboard(); }
    }

    async function deleteEvent(eventId, eventTitle) {
      if (!confirm(`Delete event "${eventTitle}"?`)) return;
      const response = await fetch(`/api/events/${eventId}`, { method: 'DELETE' });
      const data = await response.json();
      if (data.success) { alert('✅ Event deleted!'); loadDashboard(); }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    checkAuth();
  </script>
</body>
</html>
